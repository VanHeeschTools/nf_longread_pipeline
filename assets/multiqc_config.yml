# MultiQC configuration file for long-read RNA-seq pipeline

# General settings
title: "Long-read RNA-seq Analysis Report"
subtitle: "Quality Control and Processing Results"
intro_text: "This report summarizes the results of the long-read RNA-seq pipeline."

show_analysis_paths: False

# File name cleaning
extra_fn_clean_exts:
    - '_mqc'
    - '_pychopper_stats.tsv'
    - '_mapping.stats'

# Report section order
report_section_order:
    nanostat:
        order: 700
    pychopper:
        order: 50
    samtools:
        order: 40 
    stringtie_stats_table:
        order: 30
    salmon_stats_table:
        order: 20
    jaffal_fusions_table:  
        order: 10

# Plot customization
plots_force_interactive: True  # Makes plots interactive by default

# Table customization
table_columns_visible:
    NanoPlot:
        mean_read_length: True
        median_read_length: True
        mean_qscore: True
    Samtools:
        reads_mapped: True
        reads_mapped_percent: True

# Output options
output_fn_name: 'multiqc_report.html'
data_dir_name: 'multiqc_data'

# Performance options
max_table_rows: 1000  # Limit large tables

# Custom sections
custom_data:
    stringtie_stats_table:
        id: stringtie_stats_table
        section_name: "StringTie"
        description: "StringTie statistics per sample. Known and novel transcripts obtained by using gffcompare."
        plot_type: 'table'
        pconfig:
            id: 'StringTie stats'
        file_format: tsv

    salmon_stats_table:
        id: "salmon_stats_table"
        section_name: "Salmon stats table"
        parent_description: "Salmon statistics per sample."
        description: "Salmon statistics per sample. The mean and median statistics were generated by using the transcript/gene rows where values are higher than 0."
        plot_type: 'table'
        pconfig:
            id: 'salmon_stats_table'
        file_format: tsv
    
    jaffal_fusions_table:
        id: "jaffal_fusions_table"
        section_name: "JAFFAL"
        description: "JAFFAL counts showing classification statistics"
        plot_type: 'table'
        pconfig:
            id: 'jaffal_fusions_table'
        file_format: csv

# Specific module configurations
sp:
    nanoplot:
        fn: '*NanoStats.txt'
    pychopper:
        fn: '*pychopper_stats.tsv'
    samtools/stats:
        fn: '*.stats'
    stringtie_stats_table:
        fn: '*_samples_stringtie_counts_mqc.tsv'
    salmon_stats_table:
        fn: '*_multiqc_summary_mqc.tsv'
    jaffal_fusions_table:
        fn: 'jaffal_mqc.csv'
